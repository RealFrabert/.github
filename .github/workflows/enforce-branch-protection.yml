name: Enforce branch protection

# Repository creation is not a workflow trigger (the earlier `repository: types: [created]`
# made GitHub reject this file, so it never ran — RealFrabert/.github#1). The daily schedule
# bounds how long a new repo goes without the ruleset; run it by hand after creating a repo.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  enforce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A dedicated app with Administration: write and nothing else. Its key lives only in
      # these secrets, never on a host where FCF sessions run, so no session can mint a
      # token that removes protection. frabert-fcf-merger lacks Administration on purpose.
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROTECTION_APP_ID }}
          private-key: ${{ secrets.PROTECTION_APP_PRIVATE_KEY }}
          owner: RealFrabert

      # The restriction is a repo ruleset, not classic branch protection: a single `update`
      # rule that only frabert-fcf-merger and org admins bypass. Status checks and reviews
      # stay in the org rulesets; bypass actors skip every rule of their ruleset, so this one
      # carries nothing else.
      - name: Ensure the merger-only ruleset on every unarchived repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NAME: Merger-only updates to main
        run: |
          merger_id=$(gh api /apps/frabert-fcf-merger --jq .id)
          ruleset=$(jq -n --arg name "$NAME" --argjson id "$merger_id" '{
            name: $name, target: "branch", enforcement: "active",
            conditions: {ref_name: {include: ["refs/heads/main"], exclude: []}},
            rules: [{type: "update", parameters: {update_allows_fetch_and_merge: false}}],
            bypass_actors: [
              {actor_id: $id, actor_type: "Integration", bypass_mode: "always"},
              {actor_id: null, actor_type: "OrganizationAdmin", bypass_mode: "always"}]}')
          failed=0; done_count=0
          for repo in $(gh repo list RealFrabert --no-archived --limit 1000 --json name --jq '.[].name'); do
            if ! id=$(gh api "/repos/RealFrabert/$repo/rulesets?includes_parents=false" --jq "[.[] | select(.name == \"$NAME\")][0].id // empty" 2>&1); then
              echo "::error::$repo: cannot list rulesets: $id"; failed=1; continue
            fi
            if [ -z "$id" ]; then
              if echo "$ruleset" | gh api "/repos/RealFrabert/$repo/rulesets" --method POST --input - --silent; then
                echo "fixed  $repo"; done_count=$((done_count + 1))
                echo "- created the ruleset on \`$repo\`" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::failed to create the ruleset on $repo"; failed=1
              fi
            else
              # Never overwrite a ruleset someone changed by hand; report it instead.
              shape=$(gh api "/repos/RealFrabert/$repo/rulesets/$id" --jq "[.enforcement, ([.rules[].type] | join(\",\")), ([.bypass_actors[] | select(.actor_type == \"Integration\") | .actor_id] | map(tostring) | join(\",\"))] | join(\" \")")
              if [ "$shape" = "active update $merger_id" ]; then
                echo "ok     $repo"; done_count=$((done_count + 1))
              else
                echo "::error::$repo: ruleset $id differs (enforcement, rules, app bypass = $shape); not overwriting"; failed=1
              fi
            fi
            # Classic protection is retired in favour of the ruleset; flag any that reappears.
            if gh api "/repos/RealFrabert/$repo/branches/main/protection" --silent 2>/dev/null; then
              echo "::warning::$repo still has classic branch protection on main"
            fi
          done
          if [ "$done_count" -eq 0 ]; then
            echo "::error::no repo confirmed to carry the ruleset; the token or the repo list is wrong"; failed=1
          fi
          echo "$done_count repos carry the merger-only ruleset" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
